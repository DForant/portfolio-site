[build]
  publish = "frontend/dist" # Vite build output directory
  functions = "netlify/functions"
  command = "npm --workspace frontend run build" # Build Sass and Vite during Netlify build

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["nodemailer", "xss"]
  included_files = []

[dev]
  framework = "#static"
  command = "" # no build step needed for static site
  port = 8888 # serve directly on 8888 for consistency with README

# Redirect API style path to function (optional convenience)
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

# Redirect articles API to function
[[redirects]]
  from = "/api/articles"
  to = "/.netlify/functions/articles"
  status = 200
  force = true

# Serve a blocking robots.txt on the staging domain; allow on others
[[redirects]]
  from = "/robots.txt"
  to = "/robots-staging.txt"
  status = 200
  force = true
  conditions = { Host = ["staging.deanforantdesigns.com", "deanforantdesigns-staging.netlify.app"] }

[[redirects]]
  from = "/robots.txt"
  to = "/robots-prod.txt"
  status = 200
  force = true
  conditions = { Host = ["www.deanforantdesigns.com", "deanforantdesigns.com"] }

## X-Robots-Tag noindex for staging
# Set this header via Netlify UI on the STAGING site:
# Site → Web security → Response headers → Add header →
#   Name: X-Robots-Tag
#   Value: noindex, nofollow
# This avoids identity rewrites that can interfere with static file serving.

# Force canonical www on production apex (if apex is attached to this site)
[[redirects]]
  from = "/*"
  to = "https://www.deanforantdesigns.com/:splat"
  status = 301
  conditions = { Host = ["deanforantdesigns.com"] }

# SPA fallback - must be last redirect rule
# This catches all routes that don't match files and serves index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
