[build]
  publish = "frontend" # directory with index.html
  functions = "netlify/functions"
  command = "npm --workspace frontend run build" # compile Sass → CSS during Netlify build

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["nodemailer", "xss"]
  included_files = []

[dev]
  framework = "#static"
  command = "" # no build step needed for static site
  port = 8888 # serve directly on 8888 for consistency with README

# Redirect API style path to function (optional convenience)
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

# Serve a blocking robots.txt on the staging domain; allow on others
[[redirects]]
  from = "/robots.txt"
  to = "/robots-staging.txt"
  status = 200
  force = true
  conditions = { Host = ["staging.deanforantdesigns.com", "deanforantdesigns-staging.netlify.app"] }

[[redirects]]
  from = "/robots.txt"
  to = "/robots-prod.txt"
  status = 200
  force = true
  conditions = { Host = ["www.deanforantdesigns.com", "deanforantdesigns.com"] }

# Add X-Robots-Tag noindex,nofollow for all pages on staging domain
[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200
  force = true
  conditions = { Host = ["staging.deanforantdesigns.com", "deanforantdesigns-staging.netlify.app"] }
  headers = { X-Robots-Tag = "noindex, nofollow" }

# Force canonical www on production apex (if apex is attached to this site)
[[redirects]]
  from = "/*"
  to = "https://www.deanforantdesigns.com/:splat"
  status = 301
  conditions = { Host = ["deanforantdesigns.com"] }
