<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#F8F9FA"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B8BBF;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#3A5A8A;stop-opacity:0.25" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#grad1)"/>
  
  <!-- Icon -->
  <g transform="translate(400, 250)">
    <!-- Document icon -->
    <path d="M -60 -80 L 40 -80 L 40 -40 L 60 -20 L 60 80 L -60 80 Z" 
          fill="none" 
          stroke="#4A6C9B" 
          stroke-width="4"
          stroke-linejoin="round"/>
    <path d="M 40 -40 L 60 -20 L 40 -20 Z" 
          fill="#4A6C9B" 
          stroke="#4A6C9B" 
          stroke-width="2"/>
    <!-- Lines representing text -->
    <line x1="-40" y1="-20" x2="20" y2="-20" stroke="#4A6C9B" stroke-width="3" opacity="0.6"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#4A6C9B" stroke-width="3" opacity="0.6"/>
    <line x1="-40" y1="20" x2="40" y2="20" stroke="#4A6C9B" stroke-width="3" opacity="0.6"/>
    <line x1="-40" y1="40" x2="20" y2="40" stroke="#4A6C9B" stroke-width="3" opacity="0.6"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="400" 
        font-family="'Playfair Display', serif" 
        font-size="24" 
        fill="#4A6C9B" 
        text-anchor="middle"
        font-weight="700">
    Article Image Placeholder
  </text>
</svg>
